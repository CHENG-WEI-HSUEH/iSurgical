#Procedure: Laparoscopic Cholecystectomy
laparoscopic cholecystectomy:
  head_groups:
    - [1, 2, 3, 13]            # Gallbladder, Cystic duct, Cystic artery, Common bile duct
    - [4, 15]                  # Liver, Rouvieres sulcus
    - [5, 12, 14]              # Hepatoduodenal ligament, Duodenum, Fat
    - [6, 7, 8, 9, 10, 11]     # bipolar, clipper, grasper, hook, irrigator, scissors

  # Post-processor (YoloSegPostprocesserGPU)
  kclass_colours:
    - [0.0, 0.0, 0.0, 0.2]                  #"Background"
    - [0.0, 1.0, 0.0, 0.2]                  #"Gallbladder"
    - [1.0, 0.0, 0.0, 0.2]                  #"Cystic duct"
    - [0.0, 0.0, 1.0, 0.2]                  #"Cystic artery"
    - [0.4706, 0.7333, 1.0, 0.2]            #"Liver"
    - [1.0, 0.0, 1.0, 0.2]                  #"Hepatoduodenal ligament"
    - [0.5961, 0.8745, 0.5412, 0.2]         #"bipolar"
    - [0.1216, 0.4667, 0.7059, 0.2]         #"clipper"
    - [0.6824, 0.7804, 0.9098, 0.2]         #"grasper"
    - [1.0, 0.4980, 0.0549, 0.2]            #"hook"
    - [1.0, 0.7333, 0.4706, 0.2]            #"irrigator"
    - [0.1725, 0.6275, 0.1725, 0.2]         #"scissors"
    - [0.5412, 0.8745, 0.5961, 0.2]         #"Duodenum"
    - [0.8392, 0.1529, 0.1569, 0.2]         #"Common bile duct"
    - [1.0, 0.5961, 0.5882, 0.2]            #"Fat"
    - [1.0, 1.0, 0.0, 0.2]                  #"Rouvieres sulcus"

  #Segementation parameters
  label_names:
    - "Background"
    - "Gallbladder"
    - "Cystic duct"
    - "Cystic artery"
    - "Liver"
    - "Hepatoduodenal ligament"
    - "bipolar"
    - "clipper"
    - "grasper"
    - "hook"
    - "irrigator"
    - "scissors"
    - "Duodenum"
    - "Common bile duct"
    - "Fat"
    - "Rouvieres sulcus"

  ConfidenceThreshold: 0.25
  IoUThreshold: 0.5
  MaskThreshold: 0.5
  NumClass: 16

  RSD_Period: 15
  
  # Phase Name
  Phase:
    - "Preparation"
    - "CalotTriangleDissection"
    - "ClippingCutting"   
    - "GallbladderDissection"      
    - "GallbladderPackaging"        
    - "CleaningCoagulation"         
    - "GallbladderRetraction"       